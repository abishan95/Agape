<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090C" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AGAPE 2026</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Immediately clear old service workers and unregister stale caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.update();
          }
        });
      }
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#07090C;color:#F8FAFC;width:100%;min-height:100%;overflow-x:hidden;">
    <div id="root" style="width:100%;min-height:100dvh;display:flex;flex-direction:column;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
